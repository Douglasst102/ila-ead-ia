# Stub — build Next.js standalone; Ingress TLS no edge COMGAP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sad-ila-web
  namespace: sad-ila
  labels:
    app: sad-ila-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sad-ila-web
  template:
    metadata:
      labels:
        app: sad-ila-web
    spec:
      containers:
        - name: web
          image: ghcr.io/example/sad-ila-web:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: sad-ila-web-config
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sad-ila-web
  namespace: sad-ila
spec:
  selector:
    app: sad-ila-web
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
